name: Build and Release OSD Plugins

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset configuration'
        required: true
        default: 'custom'
        type: choice
        options:
          - custom
          - dashboards-investigation
      repository:
        description: 'Repository to build (owner/repo) - only used if preset is "custom"'
        required: false
        type: string
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'main'
        type: string
      build_command:
        description: 'Build command - only used if preset is "custom"'
        required: false
        default: 'yarn build'
        type: string
      artifact_path:
        description: 'Path to the file to upload - only used if preset is "custom"'
        required: false
        type: string
      release_tag:
        description: 'Release tag (e.g., v1.0.0). If not provided, auto-generates timestamp tag'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Load preset configuration
        id: config
        run: |
          PRESET="${{ inputs.preset }}"

          if [ "$PRESET" = "custom" ]; then
            # Custom preset - use manual inputs with fallback to main
            BRANCH="${{ inputs.branch }}"
            BRANCH="${BRANCH:-main}"

            # Extract plugin name from repository (everything after last /)
            PLUGIN_NAME=$(echo "${{ inputs.repository }}" | sed 's/.*\///')

            echo "repository=${{ inputs.repository }}" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "build_command=${{ inputs.build_command }}" >> $GITHUB_OUTPUT
            echo "artifact_pattern=${{ inputs.artifact_path }}" >> $GITHUB_OUTPUT
            echo "preset_name=Custom" >> $GITHUB_OUTPUT
            echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT
          else
            # Load from preset file
            PRESET_FILE="presets/${PRESET}.yml"

            if [ ! -f "$PRESET_FILE" ]; then
              echo "Error: Preset file not found: $PRESET_FILE"
              exit 1
            fi

            # Parse YAML file (simple key: value format)
            PRESET_NAME=$(grep '^name:' "$PRESET_FILE" | sed 's/^name: *//')
            REPOSITORY=$(grep '^repository:' "$PRESET_FILE" | sed 's/^repository: *//')
            PRESET_BRANCH=$(grep '^branch:' "$PRESET_FILE" | sed 's/^branch: *//')
            BUILD_COMMAND=$(grep '^build_command:' "$PRESET_FILE" | sed 's/^build_command: *//')
            ARTIFACT_PATTERN=$(grep '^artifact_pattern:' "$PRESET_FILE" | sed 's/^artifact_pattern: *//')
            PLUGIN_NAME=$(grep '^plugin_name:' "$PRESET_FILE" | sed 's/^plugin_name: *//')

            # Priority: preset branch > input branch > default 'main'
            BRANCH="${PRESET_BRANCH:-${{ inputs.branch }}}"
            BRANCH="${BRANCH:-main}"

            # If plugin_name not specified, extract from repository name
            if [ -z "$PLUGIN_NAME" ]; then
              PLUGIN_NAME=$(echo "$REPOSITORY" | sed 's/.*\///')
            fi

            echo "repository=$REPOSITORY" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "build_command=$BUILD_COMMAND" >> $GITHUB_OUTPUT
            echo "artifact_pattern=$ARTIFACT_PATTERN" >> $GITHUB_OUTPUT
            echo "preset_name=$PRESET_NAME" >> $GITHUB_OUTPUT
            echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT

            echo "Loaded preset: $PRESET_NAME"
            echo "  Repository: $REPOSITORY"
            echo "  Branch: $BRANCH"
            echo "  Build command: $BUILD_COMMAND"
            echo "  Artifact pattern: $ARTIFACT_PATTERN"
            echo "  Plugin name: $PLUGIN_NAME"
          fi

      - name: Checkout OpenSearch Dashboards
        uses: actions/checkout@v4
        with:
          repository: opensearch-project/OpenSearch-Dashboards
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          path: OpenSearch-Dashboards

      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: ${{ steps.config.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: OpenSearch-Dashboards/plugins/${{ steps.config.outputs.plugin_name }}

      - name: Set up Node.js with nvm
        working-directory: OpenSearch-Dashboards
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install
          nvm use

      - name: Bootstrap OpenSearch Dashboards
        working-directory: OpenSearch-Dashboards
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use
          yarn osd bootstrap

      - name: Run build command
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd OpenSearch-Dashboards
          nvm use
          cd plugins/${{ steps.config.outputs.plugin_name }}
          ${{ steps.config.outputs.build_command }}

      - name: Find and verify artifact
        id: verify_artifact
        run: |
          ARTIFACT_PATTERN="OpenSearch-Dashboards/plugins/${{ steps.config.outputs.plugin_name }}/${{ steps.config.outputs.artifact_pattern }}"

          # Find files matching the pattern
          ARTIFACT_FILES=$(ls $ARTIFACT_PATTERN 2>/dev/null | head -n 1)

          if [ -z "$ARTIFACT_FILES" ]; then
            echo "Error: No artifact found matching pattern: $ARTIFACT_PATTERN"
            exit 1
          fi

          echo "artifact_path=$ARTIFACT_FILES" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename $ARTIFACT_FILES)" >> $GITHUB_OUTPUT
          echo "Found artifact: $ARTIFACT_FILES"

      - name: Generate release tag
        id: generate_tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
            echo "Using provided tag: $TAG"
          else
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            TAG="release-${TIMESTAMP}"
            echo "Generated timestamp tag: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.generate_tag.outputs.tag }}
          name: ${{ steps.config.outputs.preset_name }} - ${{ steps.generate_tag.outputs.tag }}
          body: |
            **${{ steps.config.outputs.preset_name }}**

            Repository: ${{ steps.config.outputs.repository }}
            Branch: ${{ steps.config.outputs.branch }}
            Build command: ${{ steps.config.outputs.build_command }}

            Built on: ${{ github.run_id }}
          draft: false
          prerelease: true
          allowUpdates: true
          artifacts: ${{ steps.verify_artifact.outputs.artifact_path }}
          artifactContentType: application/zip
